<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brotzeit App öffnen</title>
<style>
  :root {
    color-scheme: light dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fafafa;
    color: #1a1a1a;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #121212; color: #f0f0f0; }
    .card { background: #1d1d1d !important; border-color: #2e2e2e !important; }
    .code-box { background: #262626 !important; border-color: #3a3a3a !important; }
    .store-btn.secondary { border-color: #3a3a3a !important; color: #f0f0f0 !important; }
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: #ffffff;
    border: 1px solid #ececec;
    border-radius: 20px;
    padding: 32px 24px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.06);
  }
  .emoji {
    font-size: 56px;
    line-height: 1;
    margin-bottom: 8px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 6px;
  }
  p.subtitle {
    margin: 0 0 20px;
    font-size: 15px;
    color: #777;
  }
  .code-box {
    margin: 0 0 20px;
    padding: 16px;
    background: #f4f4f5;
    border: 1px solid #e5e5e6;
    border-radius: 14px;
  }
  .code-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #999;
    margin-bottom: 6px;
  }
  .code-value {
    font-family: "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 0.08em;
  }
  .copy-btn {
    margin-top: 10px;
    border: none;
    background: none;
    color: #2d7dfb;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    padding: 4px 8px;
  }
  .copy-btn:active { opacity: 0.6; }
  .status {
    font-size: 14px;
    color: #999;
    margin-bottom: 20px;
    min-height: 18px;
  }
  .store-btn {
    display: block;
    width: 100%;
    padding: 14px;
    margin-bottom: 10px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    border: 1px solid transparent;
  }
  .store-btn.primary {
    background: #1a1a1a;
    color: #fff;
  }
  @media (prefers-color-scheme: dark) {
    .store-btn.primary { background: #f0f0f0; color: #121212; }
  }
  .store-btn.secondary {
    background: transparent;
    color: #1a1a1a;
    border-color: #d8d8d8;
  }
  footer {
    margin-top: 22px;
    font-size: 11px;
  }
  footer a {
    color: #ccc;
    text-decoration: none;
  }
  @media (prefers-color-scheme: dark) {
    footer a { color: #555 !important; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">🌭</div>
    <h1>Brotzeit</h1>
    <p class="subtitle" id="subtitle">Gruppenbestellungen, ganz einfach.</p>

    <div class="code-box" id="codeBox" style="display:none;">
      <div class="code-label">Gruppencode</div>
      <div class="code-value" id="codeValue"></div>
      <button class="copy-btn" id="copyBtn" type="button">📋 Code kopieren</button>
    </div>

    <p class="status" id="status"></p>

    <div id="buttons">
      <a class="store-btn primary" id="appStoreBtn" href="#" style="display:none;">Im App Store öffnen</a>
      <a class="store-btn secondary" id="playStoreBtn" href="#" style="display:none;">Bei Google Play öffnen</a>
    </div>
  </div>

  <footer>
    <a href="https://www.termsfeed.com/live/70dd6bdd-3859-43af-b693-244387fa8a52" target="_blank" rel="noopener">Datenschutz</a>
  </footer>

<script>
(function () {
  // ---------------------------------------------------------------------
  // Konfiguration
  // ---------------------------------------------------------------------
  var APP_STORE_URL = "https://apps.apple.com/de/app/brotzeit-app/id6775463551";
  var PLAY_PACKAGE = "de.brotzeit.app";
  var PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=" + PLAY_PACKAGE;
  var SCHEME = "brotzeit://join?code=";

  // ---------------------------------------------------------------------
  // Hilfsfunktionen
  // ---------------------------------------------------------------------
  var ua = navigator.userAgent || "";
  var isIOS = /iPhone|iPad|iPod/.test(ua) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); // iPadOS meldet sich manchmal als Mac
  var isAndroid = /Android/.test(ua);
  // In-App-Browser (Instagram, Facebook, ...) blockieren benutzerdefinierte
  // URL-Schemes oft stillschweigend – dort direkt die Store-Buttons zeigen
  // statt den automatischen Versuch zu starten.
  var isInAppBrowser = /Instagram|FBAN|FBAV|Line\//.test(ua);

  var params = new URLSearchParams(window.location.search);
  var code = params.get("code");

  var statusEl = document.getElementById("status");
  var appStoreBtn = document.getElementById("appStoreBtn");
  var playStoreBtn = document.getElementById("playStoreBtn");

  appStoreBtn.href = APP_STORE_URL;
  playStoreBtn.href = PLAY_STORE_URL;

  function zeigeStoreButtons() {
    if (isIOS) {
      appStoreBtn.style.display = "block";
    } else if (isAndroid) {
      playStoreBtn.style.display = "block";
    } else {
      // Desktop: beide anzeigen
      appStoreBtn.style.display = "block";
      playStoreBtn.style.display = "block";
    }
  }

  // ---------------------------------------------------------------------
  // Gruppencode anzeigen + kopierbar machen
  // ---------------------------------------------------------------------
  if (code) {
    document.getElementById("subtitle").textContent =
      "Du wurdest zu einer Gruppe eingeladen.";
    var codeBox = document.getElementById("codeBox");
    var codeValue = document.getElementById("codeValue");
    codeBox.style.display = "block";
    codeValue.textContent = code;

    document.getElementById("copyBtn").addEventListener("click", function () {
      var btn = this;
      navigator.clipboard.writeText(code).then(function () {
        btn.textContent = "✓ Kopiert";
        setTimeout(function () { btn.textContent = "📋 Code kopieren"; }, 1500);
      }).catch(function () {
        // Fallback für sehr alte Browser
        window.prompt("Code manuell kopieren:", code);
      });
    });
  }

  // ---------------------------------------------------------------------
  // App öffnen / zum passenden Store weiterleiten
  //
  // Wichtig: In-App-Browser (Instagram, Facebook, ...) blockieren oft nur
  // das benutzerdefinierte "brotzeit://"-Schema (App öffnen) – ein normaler
  // https-Link zum App Store/Play Store funktioniert dort aber problemlos.
  // Deshalb nur den App-Öffnen-Versuch bei In-App-Browsern überspringen,
  // den Store-Redirect selbst aber immer ausführen.
  // ---------------------------------------------------------------------
  if (isIOS || isAndroid) {
    var storeUrl = isIOS ? APP_STORE_URL : PLAY_STORE_URL;

    if (code && !isInAppBrowser) {
      // App-Öffnen-Versuch, mit Store als Fallback falls nicht installiert.
      statusEl.textContent = "App wird geöffnet …";

      if (isIOS) {
        var iosAppUrl = SCHEME + encodeURIComponent(code);
        setTimeout(function () { window.location = iosAppUrl; }, 250);
      } else {
        var intentUrl =
          "intent://join?code=" + encodeURIComponent(code) +
          "#Intent;scheme=brotzeit;package=" + PLAY_PACKAGE +
          ";S.browser_fallback_url=" + encodeURIComponent(PLAY_STORE_URL) + ";end";
        setTimeout(function () { window.location = intentUrl; }, 250);
      }
      setTimeout(function () {
        if (!document.hidden) {
          statusEl.textContent = "App nicht installiert – weiter zum Store …";
          window.location = storeUrl;
        }
      }, 2200);
    } else {
      // Kein Code, oder In-App-Browser: direkt zum Store weiterleiten,
      // kein Versuch, die App per brotzeit:// zu öffnen.
      statusEl.textContent = "Weiter zum Store …";
      setTimeout(function () { window.location = storeUrl; }, 250);
    }

    // Manuelle Buttons trotzdem anzeigen, falls der automatische Versuch
    // fehlschlägt oder der Nutzer nicht warten will.
    setTimeout(zeigeStoreButtons, 400);
  } else {
    // Desktop: kein Redirect-Versuch, nur beide Buttons anzeigen.
    zeigeStoreButtons();
  }
})();
</script>
</body>
</html>
